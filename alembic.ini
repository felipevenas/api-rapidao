[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL sobrescrita dinamicamente pelo env.py via app.core.config.settings
# Fallback local para execução fora do Docker:
sqlalchemy.url = postgresql+psycopg2://rapidao_user:rapidao_pass@localhost:5432/rapidao_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
